{% extends "base.html" %}

{% block title %}Check Out{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
        <h1 class="page-title">Check out</h1>
        <p class="page-subtitle">Record your end time for the day.</p>
    </div>
    <a href="{% url 'checkin:list' %}" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<div class="row">
    <div class="col-lg-6">
        <div class="card p-4">
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "partials/form_fields.html" %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Check out</button>
                    <a href="{% url 'checkin:list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
