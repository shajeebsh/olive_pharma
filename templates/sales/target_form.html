{% extends "base.html" %}

{% block title %}New Target{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
        <h1 class="page-title">New target</h1>
        <p class="page-subtitle">Set a monthly or quarterly target for a representative.</p>
    </div>
    <a href="{% url 'sales:target_list' %}" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card p-4">
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "partials/form_fields.html" %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save target</button>
                    <a href="{% url 'sales:target_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
