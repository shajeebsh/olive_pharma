{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div class="app-brand justify-content-center">
                <span class="app-brand-icon"><i class="bi bi-capsule"></i></span>
                <span class="app-brand-name">OlivePharma</span>
            </div>
            <p class="page-subtitle mt-2">Field activity &amp; sales tracking</p>
        </div>
        <div class="card p-4">
            <h1 class="page-title mb-3">Sign in</h1>
            {% if form.errors %}
            <div class="alert alert-danger py-2">Invalid username or password.</div>
            {% endif %}
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                    <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                    <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
