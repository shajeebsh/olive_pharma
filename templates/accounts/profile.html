{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
        <h1 class="page-title">Profile</h1>
        <p class="page-subtitle">Your account details and role.</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-7">
        <div class="card p-4">
            <div class="mb-3">
                <span class="form-label d-block">Username</span>
                <div class="fw-semibold">{{ user.username }}</div>
            </div>
            <div class="mb-3">
                <span class="form-label d-block">Role</span>
                <span class="badge bg-light text-dark border">{{ USER_ROLE|default:"—" }}</span>
            </div>
            <hr>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "partials/form_fields.html" %}
                <button type="submit" class="btn btn-primary">Save profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
