services:
  - type: web
    name: olive-pharma
    runtime: python
    plan: free
    pythonVersion: "3.11.1"
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: olive-pharma-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: TIME_ZONE
        value: UTC

databases:
  - name: olive-pharma-db
    databaseName: olive_pharma
    user: olive
    plan: free
