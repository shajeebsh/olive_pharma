{% extends "base.html" %}
{% load wagtailcore_tags wagtailuserbar %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
{% wagtailuserbar %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <h1 class="page-title mb-3">{{ page.title }}</h1>
        {% if page.intro %}<div class="lead text-secondary mb-4">{{ page.intro|richtext }}</div>{% endif %}
        <div class="card p-4">
            {{ page.body|richtext }}
        </div>
    </div>
</div>
{% endblock %}
